<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#703F37" />
      <stop offset="50%" stop-color="#582F28" />
      <stop offset="100%" stop-color="#3A1E19" />
    </linearGradient>

    <!-- Accent Hand Gradient -->
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F5EFE6" />
      <stop offset="100%" stop-color="#E5D6C5" />
    </linearGradient>

    <!-- Voice Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E60E7E" />
      <stop offset="60%" stop-color="#C29591" />
      <stop offset="100%" stop-color="#7D94B5" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5" filter="url(#softGlow)" />

  <!-- Subtle Inner Ring -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="13.5" fill="none" stroke="rgba(194, 149, 145, 0.15)" stroke-width="1" />

  <!-- Sign Hand Silhouette (Left side) -->
  <g transform="translate(1, 0)">
    <!-- Palm & Wrist -->
    <path d="M19 46 C16 46 14 43 14 39 L14 30 C14 28.5 15.2 27.5 16.7 27.5 C18.2 27.5 19.3 28.6 19.3 30.1 L19.3 35 L21 35 L21 21 C21 19.5 22.2 18.3 23.7 18.3 C25.2 18.3 26.4 19.5 26.4 21 L26.4 33 L28 33 L28 17 C28 15.5 29.2 14.3 30.7 14.3 C32.2 14.3 33.4 15.5 33.4 17 L33.4 33 L35 33 L35 21 C35 19.5 36.2 18.3 37.7 18.3 C39.2 18.3 40.4 19.5 40.4 21 L40.4 34 C40.4 41.5 35 46 27 46 Z"
          fill="url(#handGrad)" />

    <!-- Thumb (Angled out) -->
    <path d="M14.5 32 C12.5 31 10.5 32.5 11 35 C12 39.5 16 43 19 44 L19 37 C16.5 37 14.5 34.5 14.5 32 Z"
          fill="url(#handGrad)" opacity="0.95" />
  </g>

  <!-- Speech / Sound Waves (Right side - Sign to Speech conversion) -->
  <g fill="none" stroke-linecap="round">
    <!-- Wave 1 (Inner pulse) -->
    <path d="M43 27 C44.5 29 44.5 33 43 35"
          stroke="url(#waveGrad)" stroke-width="2.8" />

    <!-- Wave 2 (Middle pulse) -->
    <path d="M48 23 C51 26.5 51 35.5 48 39"
          stroke="url(#waveGrad)" stroke-width="2.6" stroke-opacity="0.9" />

    <!-- Wave 3 (Outer pulse) -->
    <path d="M53 19 C57.5 24 57.5 38 53 43"
          stroke="url(#waveGrad)" stroke-width="2.2" stroke-opacity="0.75" />
  </g>

  <!-- Small AI Sparkle Star top right -->
  <path d="M47 13 L48 10 L49 13 L52 14 L49 15 L48 18 L47 15 L44 14 Z"
        fill="#FFD700" />
</svg>
